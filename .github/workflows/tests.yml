name: tests

on:
  push:
    branches:
      - main
  pull_request:

# Pass GitHub token to composer so dist downloads aren't rate-limited; force
# package:discover (post-autoload-dump → @composer run prepare) to use an
# in-memory cache store, otherwise it tries the default `database` driver
# and fails with "no such table: cache" since no DB is migrated yet.
env:
  COMPOSER_AUTH: '{"github-oauth": {"github.com": "${{ secrets.GITHUB_TOKEN }}"}}'
  CACHE_STORE: array
  CACHE_DRIVER: array
  DB_CONNECTION: sqlite
  DB_DATABASE: ':memory:'

jobs:
  pest:
    runs-on: ubuntu-latest

    strategy:
      fail-fast: false
      matrix:
        php: ['8.4']
        laravel: ['12.*', '13.*']
        filament: ['^4.0', '^5.0']
        include:
          - laravel: '12.*'
            testbench: '10.*'
          - laravel: '13.*'
            testbench: '11.*'

    name: P${{ matrix.php }} - L${{ matrix.laravel }} - F${{ matrix.filament }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          extensions: dom, curl, libxml, mbstring, zip, pcntl, bcmath, intl, fileinfo
          coverage: none
          tools: composer:v2

      - name: Cache composer dependencies
        uses: actions/cache@v4
        with:
          path: ~/.composer/cache/files
          key: dependencies-laravel-${{ matrix.laravel }}-filament-${{ matrix.filament }}-php-${{ matrix.php }}-composer-${{ hashFiles('composer.json') }}

      - name: Install dependencies
        env:
          LARAVEL_VERSION: ${{ matrix.laravel }}
          TESTBENCH_VERSION: ${{ matrix.testbench }}
          FILAMENT_VERSION: ${{ matrix.filament }}
        run: |
          composer require "laravel/framework:${LARAVEL_VERSION}" "orchestra/testbench:${TESTBENCH_VERSION}" "filament/filament:${FILAMENT_VERSION}" --no-interaction --no-update
          composer update --prefer-dist --no-interaction --no-progress

      - name: Run Pest
        run: ./vendor/bin/pest --ci

  pint:
    runs-on: ubuntu-latest
    name: pint

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          coverage: none

      - name: Install dependencies
        run: composer install --prefer-dist --no-interaction --no-progress

      - name: Run Pint
        run: ./vendor/bin/pint --test
